name: license_app
description: "执照题库刷题应用"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  sqflite: ^2.3.3+2
  path: ^1.9.0
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.5.0
  file_picker: ^8.0.7
  shared_preferences: ^2.2.3
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  uuid: ^4.4.0
  flutter_math_fork: ^0.7.4
  gpt_markdown: ^1.2.1
  markdown: ^7.2.2
  http: ^1.2.2
  url_launcher: ^6.3.1
  curved_navigation_bar: ^1.0.6
  fl_chart: ^0.69.0
  screenshot: ^3.0.0
  image_gallery_saver_plus: ^3.0.5
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "image.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
