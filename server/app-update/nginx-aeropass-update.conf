server {
    server_name aeropass.langlai.top 8.134.68.93;

    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/aeropass.langlai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aeropass.langlai.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name aeropass.langlai.top 8.134.68.93;

    # Keep older APP builds that still use the server IP able to follow the
    # redirect to the new HTTPS endpoint.
    return 301 https://aeropass.langlai.top$request_uri;
}
